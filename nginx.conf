server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Cloud Run internal DNS resolver (needed to resolve ${BACKEND_HOST} at runtime).
    resolver 169.254.169.254 valid=10s ipv6=off;

    # Proxy API calls to the backend Cloud Run service, stripping the /backend prefix.
    location /backend/ {
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass https://${BACKEND_HOST};
        proxy_ssl_server_name on;
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        # Backend accepts uploads up to 250 MB.
        client_max_body_size 256m;
    }

    location = /backend {
        return 308 /backend/;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
