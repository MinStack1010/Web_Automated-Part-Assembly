steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-southeast1-docker.pkg.dev/striking-ruler-506214-f6/web-assembly/frontend:latest', '-t', 'asia-southeast1-docker.pkg.dev/striking-ruler-506214-f6/web-assembly/frontend:$BUILD_ID', '.']

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast1-docker.pkg.dev/striking-ruler-506214-f6/web-assembly/frontend:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'web-assembly-frontend'
      - '--image=asia-southeast1-docker.pkg.dev/striking-ruler-506214-f6/web-assembly/frontend:latest'
      - '--platform=managed'
      - '--region=asia-southeast1'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300s'
      - '--max-instances=10'

# Specify the timeout for the build
timeout: '1800s'

# Logging configuration
options:
  logging: CLOUD_LOGGING_ONLY

# Images to be pushed to Artifact Registry
images:
  - 'asia-southeast1-docker.pkg.dev/striking-ruler-506214-f6/web-assembly/frontend:latest'
  - 'asia-southeast1-docker.pkg.dev/striking-ruler-506214-f6/web-assembly/frontend:$BUILD_ID'
