# Builds the frontend image, pushes it to Artifact Registry, and deploys to Cloud Run.
# Trigger manually with:  gcloud builds submit --config cloudbuild.yaml .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/web-assembly/frontend:latest'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/web-assembly/frontend:$BUILD_ID'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/web-assembly/frontend'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - web-assembly-frontend
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/web-assembly/frontend:latest'
      - '--platform'
      - managed
      - '--region'
      - asia-southeast1
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - 512Mi
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'

timeout: '1800s'
options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/web-assembly/frontend:latest'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/web-assembly/frontend:$BUILD_ID'
